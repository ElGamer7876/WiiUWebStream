name: Integrate high-risk audio final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.2.0-dev
          fetch-depth: 0
          path: dev

      - name: Checkout integration script
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Apply integration patch
        run: python control/.github/scripts/integrate_high_risk_audio.py dev

      - name: Build toolchain image
        working-directory: dev
        run: docker build -t wiiu-web-stream-builder .

      - name: Build plugin
        working-directory: dev
        run: docker run --rm -v "$PWD:/project" wiiu-web-stream-builder make

      - name: Verify plugin
        working-directory: dev
        run: test -s WiiUWebStream.wps

      - name: Commit validated integration
        working-directory: dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/capture.cpp src/network.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Integrate high-risk audio streaming"
            git push origin HEAD:feature/v0.2.0-dev
          fi

# Retry marker: 32-bit audio atomics
