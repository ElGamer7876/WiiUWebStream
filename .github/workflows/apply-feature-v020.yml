name: Apply feature v0.2.0-dev

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-feature-v020.yml']

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2.0-dev
          fetch-depth: 0

      - name: Verify chunks and apply source changes
        run: |
          cp src/metrics.cpp /tmp/metrics-fixed.cpp
          echo '8c5d5e0e47058472f522b763a49ee969e452a46c082e84771e278e2825085abd  .bootstrap/parts/part00' | sha256sum -c -
          echo 'be78899661f28e802940ea09ea44a637ecf707c1fc23b47b39c791e3b8ea22b4  .bootstrap/parts/part01' | sha256sum -c -
          echo 'e54b71f9e0c5a5621b9bf3edab41f9c464d10523e7d2cf29d07ec025274744d3  .bootstrap/parts/part02' | sha256sum -c -
          echo '951b5c90ae9687d8b2d0a9f0dae3a32d9474c4e533b4f064cba35736b97a3c51  .bootstrap/parts/part03' | sha256sum -c -
          cat .bootstrap/parts/part00 .bootstrap/parts/part01 .bootstrap/parts/part02 .bootstrap/parts/part03 | base64 -d > /tmp/v020-changes.tar.gz
          echo '2aae29d9ce051af3b85d9830b5f2de25125ea6addc2b48b0d828e41612489700  /tmp/v020-changes.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v020-changes.tar.gz -C .
          cp /tmp/metrics-fixed.cpp src/metrics.cpp
          rm -rf .bootstrap .github/workflows/apply-v020.yml

      - name: Build Wii U plugin
        run: |
          docker build -t wiiu-web-stream-builder .
          docker run --rm -v "$PWD:/project" wiiu-web-stream-builder make
          test -s WiiUWebStream.wps

      - name: Commit feature implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset WiiUWebStream.wps || true
          git commit -m 'Implement v0.2.0-dev improvements'
          git push origin HEAD:feature/v0.2.0-dev
