name: Verify safety feature branch

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.event.head_commit.message == 'Verify safety feature branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          ref: d20c1b631aec3730b96955eed6f87685bb24627c
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "d20c1b631aec3730b96955eed6f87685bb24627c"
      - name: Build toolchain image
        run: docker build -t wiiu-web-stream-builder .
      - name: Build WUPS plugin
        run: docker run --rm -v "$PWD:/project" wiiu-web-stream-builder make
      - name: Verify output
        run: test -s WiiUWebStream.wps
