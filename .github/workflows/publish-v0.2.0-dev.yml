name: Publish v0.2.0-dev pre-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: v0.2.0-dev
      SOURCE_SHA: 82526a2c7aeed24a46cc144da065db89b6ceb60e
    steps:
      - name: Checkout exact pre-release source
        uses: actions/checkout@v4
        with:
          ref: 82526a2c7aeed24a46cc144da065db89b6ceb60e
          fetch-depth: 0

      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Build toolchain image
        run: docker build -t wiiu-web-stream-builder .

      - name: Build WUPS plugin
        run: docker run --rm -v "$PWD:/project" wiiu-web-stream-builder make

      - name: Verify output
        run: test -s WiiUWebStream.wps

      - name: Create SD-ready package and checksums
        run: |
          mkdir -p package/wiiu/environments/aroma/plugins
          cp WiiUWebStream.wps package/wiiu/environments/aroma/plugins/WiiUWebStream.wps
          (cd package && zip -r "../WiiUWebStream-${VERSION}.zip" wiiu)
          sha256sum WiiUWebStream.wps "WiiUWebStream-${VERSION}.zip" > SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Wii U Web Stream v0.2.0-dev

          First public development pre-release candidate for hardware testing.

          ### Confirmed on physical Wii U
          - Web dashboard loads over LAN.
          - TV video streaming works.
          - GamePad video streaming works.
          - TV + GamePad can stream simultaneously.

          ### Included
          - Web Settings at `/settings`.
          - Minimal low-memory WUPS recovery/status menu.
          - Capture/audio buffers are released while the WUPS menu is open to reduce Aroma config-renderer memory pressure.
          - Balanced / Low Latency / Quality / OBS / Custom presets.
          - Adaptive FPS and detailed performance telemetry.
          - Listener conflict detection, timeouts and automatic listener maintenance.
          - OBS TV, GamePad, Dual and PiP pages.
          - Optional LAN access code.
          - HIGH RISK gate with 720p/1080p, up to 60 FPS, JPEG 95, continuous capture and experimental AX PCM audio streaming.

          ### Important warning
          The previous full WUPS settings menu could run out of memory on real hardware. Full configuration has therefore moved to the browser at `http://WIIU_IP:7770/settings`. The WUPS menu is intentionally minimal.

          HIGH RISK options are experimental and may reduce game performance, freeze or crash the console. Audio and high-load modes still need broader physical hardware testing.

          Install `WiiUWebStream.wps` to:
          `SD:/wiiu/environments/aroma/plugins/WiiUWebStream.wps`
          EOF

      - name: Create tag and GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            git tag "$VERSION" "$SOURCE_SHA"
            git push origin "$VERSION"
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" WiiUWebStream.wps "WiiUWebStream-${VERSION}.zip" SHA256SUMS.txt --clobber
          else
            gh release create "$VERSION" \
              WiiUWebStream.wps \
              "WiiUWebStream-${VERSION}.zip" \
              SHA256SUMS.txt \
              --title "Wii U Web Stream ${VERSION}" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$SOURCE_SHA"
          fi
