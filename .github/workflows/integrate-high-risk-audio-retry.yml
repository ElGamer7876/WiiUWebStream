name: Integrate high-risk audio retry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2.0-dev
          fetch-depth: 0

      - name: Apply capture and network integration
        shell: python
        run: |
          from pathlib import Path

          # High-risk video load controls.
          p = Path('src/capture.cpp')
          s = p.read_text()
          s = s.replace(
              'int TargetFps(VideoSource source) { return std::clamp(source == VideoSource::TV ? Settings::tvFps.load() : Settings::gamepadFps.load(), 1, 15); }',
              'int TargetFps(VideoSource source) { return std::clamp(source == VideoSource::TV ? Settings::tvFps.load() : Settings::gamepadFps.load(), 1, Settings::HighRiskAccepted() ? 60 : 15); }')
          s = s.replace(
              'const int quality = std::clamp(Settings::jpegQuality.load(), 10, 95);',
              'const int quality = std::clamp(Settings::jpegQuality.load(), 35, Settings::HighRiskAccepted() ? 95 : 85);')
          s = s.replace(
              'if (!hasStreamClients && !oneShot) return;',
              'if (!hasStreamClients && !oneShot && !(Settings::HighRiskAccepted() && Settings::continuousCapture.load())) return;')
          p.write_text(s)

          # Audio HTTP/WAV integration and English-facing web UI.
          p = Path('src/network.cpp')
          s = p.read_text()
          if '#include "audio.hpp"' not in s:
              s = s.replace('#include "network.hpp"\n', '#include "network.hpp"\n\n#include "audio.hpp"\n')

          s = s.replace('<html lang="es">', '<html lang="en">')
          s = s.replace('Pausar/Reanudar', 'Pause/Resume')
          s = s.replace('Copiar URL', 'Copy URL')
          s = s.replace('${s.tv.clients} clientes', '${s.tv.clients} clients')
          s = s.replace('${s.gamepad.clients} clientes', '${s.gamepad.clients} clients')
          s = s.replace('<strong>Diagnóstico:</strong>', '<strong>Diagnostics:</strong>')
          s = s.replace('Aroma/WUPS · v0.2.0-dev · LAN only · MJPEG', 'Aroma/WUPS · v0.2.0-dev · LAN only · MJPEG + optional PCM audio')

          marker = 'class Listener;\nListener *gWebPtr = nullptr;'
          if 'BuildWavHeader' not in s:
              helper = '''void PutLe16(uint8_t *p, uint16_t v) {
    p[0] = static_cast<uint8_t>(v);
    p[1] = static_cast<uint8_t>(v >> 8);
}

void PutLe32(uint8_t *p, uint32_t v) {
    p[0] = static_cast<uint8_t>(v);
    p[1] = static_cast<uint8_t>(v >> 8);
    p[2] = static_cast<uint8_t>(v >> 16);
    p[3] = static_cast<uint8_t>(v >> 24);
}

std::array<uint8_t, 44> BuildWavHeader(uint32_t sampleRate) {
    std::array<uint8_t, 44> h{};
    std::memcpy(h.data(), "RIFF", 4);
    PutLe32(h.data() + 4, 0xFFFFFFFFu);
    std::memcpy(h.data() + 8, "WAVEfmt ", 8);
    PutLe32(h.data() + 16, 16);
    PutLe16(h.data() + 20, 1);
    PutLe16(h.data() + 22, 2);
    PutLe32(h.data() + 24, sampleRate);
    PutLe32(h.data() + 28, sampleRate * 4);
    PutLe16(h.data() + 32, 4);
    PutLe16(h.data() + 34, 16);
    std::memcpy(h.data() + 36, "data", 4);
    PutLe32(h.data() + 40, 0xFFFFFFFFu);
    return h;
}

'''
              s = s.replace(marker, helper + marker)

          # Extend status JSON with the high-risk/audio state.
          needle = '<< "\\\"uptimeMs\\\":" << Network::UptimeMs() << ",\\\"jpegQuality\\\":" << Settings::jpegQuality.load() << ",\\\"tv\\\":" << JsonSource(VideoSource::TV) << ",\\\"gamepad\\\":" << JsonSource(VideoSource::GamePad) << "}";'
          replacement = '''<< "\\\"uptimeMs\\\":" << Network::UptimeMs() << ",\\\"jpegQuality\\\":" << Settings::jpegQuality.load()
            << ",\\\"highRiskEnabled\\\":" << (Settings::HighRiskAccepted() ? "true" : "false")
            << ",\\\"audioEnabled\\\":" << (Audio::IsActive() ? "true" : "false")
            << ",\\\"tvAudioClients\\\":" << Audio::GetStats(Audio::Source::TV).clients
            << ",\\\"gamepadAudioClients\\\":" << Audio::GetStats(Audio::Source::GamePad).clients
            << ",\\\"tvAudioRate\\\":" << Audio::GetStats(Audio::Source::TV).sampleRate
            << ",\\\"gamepadAudioRate\\\":" << Audio::GetStats(Audio::Source::GamePad).sampleRate
            << ",\\\"tv\\\":" << JsonSource(VideoSource::TV) << ",\\\"gamepad\\\":" << JsonSource(VideoSource::GamePad) << "}";'''
          s = s.replace(needle, replacement)

          marker = '    void HandleWeb(int fd, const HttpRequest &r) {'
          if 'void ServeAudioWav' not in s:
              audio_method = '''    void ServeAudioWav(int fd, Audio::Source source) {
        if (!Settings::HighRiskAccepted() || !Settings::audioStreaming.load() || !Audio::IsActive()) {
            SendResponse(fd, 503, "Service Unavailable", "text/plain; charset=utf-8", "Audio streaming is disabled. Enable and accept high-risk actions first.\\n");
            return;
        }

        Audio::ClientConnected(source);
        uint64_t sequence = 0;
        Audio::Packet packet{};
        for (int i = 0; i < 200 && !Audio::ReadAfter(source, sequence, packet); ++i) {
            std::this_thread::sleep_for(std::chrono::milliseconds(10));
        }
        if (packet.sampleRate == 0) {
            Audio::ClientDisconnected(source);
            SendResponse(fd, 503, "Service Unavailable", "text/plain; charset=utf-8", "No audio frame available yet.\\n");
            return;
        }

        const auto wav = BuildWavHeader(packet.sampleRate);
        std::string header = "HTTP/1.1 200 OK\\r\\nServer: WiiUWebStream/0.2\\r\\nConnection: close\\r\\nCache-Control: no-store\\r\\nAccess-Control-Allow-Origin: *\\r\\nContent-Type: audio/wav\\r\\n\\r\\n";
        bool ok = SendAll(fd, header) && SendAll(fd, wav.data(), wav.size()) && SendAll(fd, packet.pcm.data(), packet.bytes);
        while (ok && mRunning.load() && Network::IsRunning() && Audio::IsActive()) {
            Audio::Packet next{};
            if (!Audio::ReadAfter(source, sequence, next)) {
                std::this_thread::sleep_for(std::chrono::milliseconds(2));
                continue;
            }
            ok = SendAll(fd, next.pcm.data(), next.bytes);
        }
        Audio::ClientDisconnected(source);
    }

'''
              s = s.replace(marker, audio_method + marker)

          # Web and source-port audio routes.
          if 'r.path == "/audio/tv.wav"' not in s:
              s = s.replace(
                  'if (r.path == "/snapshot/tv.jpg") { ServeSnapshot(fd, VideoSource::TV); return; }',
                  'if (r.path == "/audio/tv.wav") { ServeAudioWav(fd, Audio::Source::TV); return; }\n        if (r.path == "/audio/gamepad.wav") { ServeAudioWav(fd, Audio::Source::GamePad); return; }\n        if (r.path == "/snapshot/tv.jpg") { ServeSnapshot(fd, VideoSource::TV); return; }')
          if 'r.path == "/audio.wav"' not in s:
              s = s.replace(
                  'if (r.path == "/snapshot.jpg") { ServeSnapshot(fd, source); return; }',
                  'if (r.path == "/audio.wav") { ServeAudioWav(fd, source == VideoSource::TV ? Audio::Source::TV : Audio::Source::GamePad); return; }\n        if (r.path == "/snapshot.jpg") { ServeSnapshot(fd, source); return; }')

          # OBS pages: attach matching audio. Dual/PiP defaults to TV final mix.
          single_old = '<< "/stream.mjpg" << AuthSuffix(request) << "\\\"></body></html>";'
          single_new = '<< "/stream.mjpg" << AuthSuffix(request) << "\\\"><audio autoplay src=\\\"/audio/" << (source == VideoSource::TV ? "tv" : "gamepad") << ".wav" << AuthSuffix(request) << "\\\"></audio></body></html>";'
          s = s.replace(single_old, single_new)
          dual_old = '<< auth << "\\\"><img class=\\\"gp\\\" src=\\\"http://" << Network::ConsoleIpAddress() << ":" << Settings::gamepadPort.load() << "/stream.mjpg" << auth << "\\\"></body></html>";'
          dual_new = '<< auth << "\\\"><img class=\\\"gp\\\" src=\\\"http://" << Network::ConsoleIpAddress() << ":" << Settings::gamepadPort.load() << "/stream.mjpg" << auth << "\\\"><audio autoplay src=\\\"/audio/tv.wav" << auth << "\\\"></audio></body></html>";'
          s = s.replace(dual_old, dual_new)

          # Dashboard controls; JS applies auth query parameters.
          s = s.replace(
              '<strong>Diagnostics:</strong> <code>/api/status</code>',
              '<strong>Audio (HIGH RISK)</strong>: <audio id="tvAudio" controls preload="none"></audio> TV · <audio id="gpAudio" controls preload="none"></audio> GamePad<br><strong>Diagnostics:</strong> <code>/api/status</code>')
          js_marker = "document.getElementById('gpObs').href='/obs/gamepad'+auth;"
          if "tvAudio').src" not in s:
              s = s.replace(js_marker, js_marker + "document.getElementById('tvAudio').src='/audio/tv.wav'+auth;document.getElementById('gpAudio').src='/audio/gamepad.wav'+auth;")

          p.write_text(s)

      - name: Build toolchain image
        run: docker build -t wiiu-web-stream-builder .

      - name: Build plugin
        run: docker run --rm -v "$PWD:/project" wiiu-web-stream-builder make

      - name: Verify plugin
        run: test -s WiiUWebStream.wps

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/capture.cpp src/network.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire high-risk audio into HTTP and capture runtime"
          git push origin HEAD:feature/v0.2.0-dev
