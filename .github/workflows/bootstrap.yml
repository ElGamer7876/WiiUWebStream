name: Bootstrap source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and validate source archive
        run: |
          cat bootstrap/part00 bootstrap/part01 bootstrap/part02 bootstrap/part03 | base64 -d > /tmp/project.tar.gz
          gzip -t /tmp/project.tar.gz
          tar -tzf /tmp/project.tar.gz >/dev/null
          tar -xzf /tmp/project.tar.gz -C .
          test -s src/capture.cpp
          test -s src/network.cpp
          test -s LICENSE
          rm -rf bootstrap .github/workflows/bootstrap.yml
      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import project source"
          git push origin HEAD:main
