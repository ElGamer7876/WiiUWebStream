name: Bootstrap source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        run: |
          cat bootstrap/part00 bootstrap/part01 bootstrap/part02 bootstrap/part03 | base64 -d > /tmp/project.tar.gz
          echo "37ec823eeeaec1988731ec04af5f8107a607bd7c42a8b4c670e2029e35df13a2  /tmp/project.tar.gz" | sha256sum -c -
          tar -xzf /tmp/project.tar.gz -C .
          rm -rf bootstrap .github/workflows/bootstrap.yml
      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import project source"
          git push origin HEAD:main
